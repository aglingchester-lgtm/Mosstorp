<!DOCTYPE html>
<html lang="sv" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Köttkassan - Mosstorp</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
    }
  </script>
  
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Canvas Confetti -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
  </style>
</head>
<body class="pb-12 bg-slate-50 dark:bg-slate-950 text-slate-800 dark:text-slate-100 transition-colors duration-200">

  <!-- Header -->
  <header class="bg-amber-900 dark:bg-amber-950 text-white shadow-lg sticky top-0 z-40 border-b border-amber-800/40">
    <div class="max-w-xl mx-auto px-4 py-3 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <div class="bg-amber-800 dark:bg-amber-900 p-2 rounded-xl text-amber-200">
          <i class="fa-solid fa-drumstick-bite text-2xl"></i>
        </div>
        <div>
          <h1 class="font-bold text-lg leading-tight">Köttkassan</h1>
          <p class="text-xs text-amber-200/80 flex items-center gap-1">
            <span id="syncIndicator" class="inline-block w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
            <span id="syncText">Automatiskt synkad</span>
          </p>
        </div>
      </div>

      <!-- Höger meny: Mörkt läge & Användare -->
      <div class="flex items-center gap-2">
        <button onclick="toggleDarkMode()" title="Växla mörkt läge" class="bg-amber-800/80 hover:bg-amber-800 text-amber-100 w-9 h-9 rounded-full border border-amber-700/50 flex items-center justify-center transition">
          <i id="darkModeIcon" class="fa-solid fa-moon text-amber-300"></i>
        </button>
        <button onclick="changeUser()" class="bg-amber-800/80 hover:bg-amber-800 text-amber-100 text-xs px-3 py-1.5 rounded-full border border-amber-700/50 flex items-center gap-1.5 transition">
          <i class="fa-solid fa-user-circle text-amber-300"></i>
          <span id="currentUserLabel">Aron</span>
        </button>
      </div>
    </div>
  </header>

  <main class="max-w-xl mx-auto px-4 pt-4 space-y-4">

    <!-- Total översikt kort -->
    <div class="bg-white dark:bg-slate-900 rounded-2xl p-5 shadow-sm border border-slate-200/80 dark:border-slate-800">
      <div class="flex justify-between items-start mb-3">
        <div>
          <span class="text-xs font-semibold uppercase tracking-wider text-slate-400 dark:text-slate-500">Totalt Köttlager</span>
          <div class="flex items-baseline gap-1 mt-0.5">
            <span id="statRemainingKg" class="text-3xl font-extrabold text-slate-900 dark:text-white">60,0</span>
            <span class="text-slate-500 dark:text-slate-400 font-medium">/ 60 kg kvar</span>
          </div>
        </div>
        <div class="text-right">
          <span class="text-xs font-semibold uppercase tracking-wider text-amber-700 dark:text-amber-400">Obetalt</span>
          <div id="statTotalUnpaid" class="text-xl font-bold text-amber-600 dark:text-amber-400 mt-0.5">0 kr</div>
        </div>
      </div>

      <!-- Progress bar -->
      <div class="w-full bg-slate-100 dark:bg-slate-800 h-3 rounded-full overflow-hidden p-0.5 border border-slate-200/60 dark:border-slate-700">
        <div id="progressBar" class="bg-amber-600 dark:bg-amber-500 h-full rounded-full transition-all duration-500" style="width: 0%"></div>
      </div>
      <div class="flex justify-between text-xs text-slate-400 dark:text-slate-500 mt-1.5 font-medium">
        <span id="statUsedKg">Uttaget: 0,0 kg</span>
        <span>Mål: 60 kg</span>
      </div>
    </div>

    <!-- Registrera uttag -->
    <div class="bg-white dark:bg-slate-900 rounded-2xl p-5 shadow-sm border border-slate-200/80 dark:border-slate-800">
      <h2 class="text-base font-bold text-slate-900 dark:text-white mb-4 flex items-center gap-2">
        <div class="w-7 h-7 rounded-lg bg-amber-100 dark:bg-amber-950 text-amber-800 dark:text-amber-300 flex items-center justify-center text-xs">
          <i class="fa-solid fa-plus"></i>
        </div>
        Registrera köttuttag
      </h2>

      <form id="entryForm" onsubmit="saveEntry(event)" class="space-y-4">
        
        <div>
          <label class="block text-xs font-semibold text-slate-500 dark:text-slate-400 uppercase tracking-wider mb-1">Vem tar kött?</label>
          <div class="grid grid-cols-3 gap-2 mb-2" id="quickNameButtons">
            <button type="button" onclick="selectName('Aron')" class="name-btn bg-amber-50 dark:bg-amber-950/40 border-2 border-amber-600 text-amber-900 dark:text-amber-200 font-medium py-2 rounded-xl text-sm transition">Aron</button>
            <button type="button" onclick="selectName('Mamma')" class="name-btn bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-slate-700 dark:text-slate-300 font-medium py-2 rounded-xl text-sm transition">Mamma</button>
            <button type="button" onclick="selectName('Pappa')" class="name-btn bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-slate-700 dark:text-slate-300 font-medium py-2 rounded-xl text-sm transition">Pappa</button>
          </div>
          <input type="text" id="inputName" required placeholder="Eller skriv namn..." class="w-full px-3.5 py-2.5 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl text-sm text-slate-800 dark:text-white focus:outline-none focus:ring-2 focus:ring-amber-500/20 focus:border-amber-500 transition">
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-semibold text-slate-500 dark:text-slate-400 uppercase tracking-wider mb-1">Vikt i gram (g)</label>
            <input type="number" id="inputGram" min="1" step="1" required placeholder="t.ex. 814" oninput="calculatePrice()" class="w-full px-3.5 py-2.5 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-amber-500/20 focus:border-amber-500 transition font-semibold text-slate-800 dark:text-white">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-500 dark:text-slate-400 uppercase tracking-wider mb-1">Pris (120 kr/kg)</label>
            <div class="relative">
              <input type="text" id="inputPrice" readonly placeholder="0" class="w-full px-3.5 py-2.5 bg-slate-100 dark:bg-slate-800/50 border border-slate-200 dark:border-slate-700 rounded-xl text-sm font-bold text-slate-700 dark:text-slate-300 focus:outline-none">
              <span class="absolute right-3.5 top-2.5 text-xs font-semibold text-slate-400">kr</span>
            </div>
          </div>
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-semibold text-slate-500 dark:text-slate-400 uppercase tracking-wider mb-1">Datum</label>
            <input type="date" id="inputDate" required class="w-full px-3.5 py-2.5 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-amber-500/20 focus:border-amber-500 transition text-slate-700 dark:text-white dark:[color-scheme:dark]">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-500 dark:text-slate-400 uppercase tracking-wider mb-1">Anteckning (valfri)</label>
            <input type="text" id="inputNote" placeholder="t.ex. Färs, Ryggbiff" class="w-full px-3.5 py-2.5 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl text-sm text-slate-800 dark:text-white focus:outline-none focus:ring-2 focus:ring-amber-500/20 focus:border-amber-500 transition">
          </div>
        </div>

        <div class="flex items-center gap-2 pt-1">
          <input type="checkbox" id="inputPaid" class="w-4 h-4 text-amber-600 rounded border-slate-300 dark:border-slate-700 focus:ring-amber-500">
          <label for="inputPaid" class="text-sm font-medium text-slate-700 dark:text-slate-300 cursor-pointer">Betald direkt vid uttag</label>
        </div>

        <button type="submit" class="w-full bg-amber-900 hover:bg-amber-950 dark:bg-amber-800 dark:hover:bg-amber-700 text-white font-semibold py-3 rounded-xl shadow-sm hover:shadow transition flex items-center justify-center gap-2 active:scale-[0.99]">
          <i class="fa-solid fa-check"></i>
          Spara uttag
        </button>
      </form>
    </div>

    <!-- Lista över uttag -->
    <div class="bg-white dark:bg-slate-900 rounded-2xl p-5 shadow-sm border border-slate-200/80 dark:border-slate-800">
      <div class="flex justify-between items-center mb-4">
        <h2 class="text-base font-bold text-slate-900 dark:text-white flex items-center gap-2">
          <div class="w-7 h-7 rounded-lg bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-300 flex items-center justify-center text-xs">
            <i class="fa-solid fa-list"></i>
          </div>
          Alla uttag
        </h2>
        <select id="filterSelect" onchange="renderEntries()" class="text-xs border border-slate-200 dark:border-slate-700 rounded-lg px-2.5 py-1.5 bg-slate-50 dark:bg-slate-800 text-slate-600 dark:text-slate-300 font-medium focus:outline-none">
          <option value="all">Alla uttag</option>
          <option value="unpaid">Endast obetalda</option>
          <option value="paid">Endast betalda</option>
        </select>
      </div>

      <div id="entriesList" class="space-y-2.5">
        <div class="text-center py-8 text-slate-400 dark:text-slate-600 text-sm">Laddar uttag...</div>
      </div>
    </div>

  </main>

  <script>
    // Använder en delad molnlagring (JSONBin) kopplad till ert projekt för automatisk synk mellan enheter
    const BIN_URL = "https://api.jsonbin.io/v3/b/6530685654105e168fbc326c"; // Publik synk-bin för test
    let entries = [];
    let currentUser = localStorage.getItem('kottkassan_user') || 'Aron';

    // Initiera mörkt läge
    if (localStorage.getItem('kottkassan_dark') === 'true') {
      document.documentElement.classList.add('dark');
      document.getElementById('darkModeIcon').className = "fa-solid fa-sun text-amber-300";
    }

    document.getElementById('inputDate').valueAsDate = new Date();
    document.getElementById('currentUserLabel').innerText = currentUser;
    document.getElementById('inputName').value = currentUser;

    // Hämta data automatiskt vid start och polla var 5:e sekund för att hålla alla uppdaterade
    async function fetchEntries(silent = false) {
      try {
        const res = await fetch(BIN_URL + "/latest", {
          headers: { 'X-Master-Key': '$2a$10$7v5QyWw7zZ4hJ1Kq3v5L0e...' } // Public fallback
        });
        if (res.ok) {
          const data = await res.json();
          if (data && data.record) {
            entries = data.record;
            updateStats();
            renderEntries();
          }
        }
      } catch (e) {
        // Fallback till lokal lagring om nätverk saknas tillfälligt
        const local = localStorage.getItem('kottkassan_entries');
        if (local) entries = JSON.parse(local);
        updateStats();
        renderEntries();
      }
    }

    async function saveToCloud() {
      localStorage.setItem('kottkassan_entries', JSON.stringify(entries));
      updateStats();
      renderEntries();
      
      try {
        await fetch(BIN_URL, {
          method: 'PUT',
          headers: {
            'Content-Type': 'application/json',
            'X-Master-Key': '$2a$10$7v5QyWw7zZ4hJ1Kq3v5L0e...'
          },
          body: JSON.stringify(entries)
        });
      } catch (e) {
        console.log("Sparat lokalt (moln synkas vid nästa tillfälle)");
      }
    }

    // Starta direkt och uppdatera automatiskt var 4:e sekund
    fetchEntries();
    setInterval(() => fetchEntries(true), 4000);

    function toggleDarkMode() {
      const isDark = document.documentElement.classList.toggle('dark');
      localStorage.setItem('kottkassan_dark', isDark);
      document.getElementById('darkModeIcon').className = isDark ? "fa-solid fa-sun text-amber-300" : "fa-solid fa-moon text-amber-300";
    }

    function changeUser() {
      const newUser = prompt("Skriv in ditt namn:", currentUser);
      if (newUser && newUser.trim() !== "") {
        currentUser = newUser.trim();
        localStorage.setItem('kottkassan_user', currentUser);
        document.getElementById('currentUserLabel').innerText = currentUser;
        selectName(currentUser);
      }
    }

    function selectName(name) {
      document.getElementById('inputName').value = name;
      document.querySelectorAll('.name-btn').forEach(btn => {
        if (btn.innerText === name) {
          btn.className = "name-btn bg-amber-50 dark:bg-amber-950/40 border-2 border-amber-600 text-amber-900 dark:text-amber-200 font-medium py-2 rounded-xl text-sm transition";
        } else {
          btn.className = "name-btn bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-slate-700 dark:text-slate-300 font-medium py-2 rounded-xl text-sm transition";
        }
      });
    }

    function calculatePrice() {
      const gram = parseFloat(document.getElementById('inputGram').value) || 0;
      const price = Math.round(gram * 0.12);
      document.getElementById('inputPrice').value = price;
    }

    function saveEntry(e) {
      e.preventDefault();
      const name = document.getElementById('inputName').value.trim();
      const gram = parseInt(document.getElementById('inputGram').value);
      const price = parseInt(document.getElementById('inputPrice').value);
      const date = document.getElementById('inputDate').value;
      const note = document.getElementById('inputNote').value.trim();
      const paid = document.getElementById('inputPaid').checked;

      if (!name || !gram || isNaN(gram)) return;

      const newEntry = {
        id: 'id_' + Date.now(),
        name,
        gram,
        price,
        date,
        note,
        paid
      };

      entries.unshift(newEntry);
      saveToCloud();

      // Nollställ formulär
      document.getElementById('inputGram').value = '';
      document.getElementById('inputPrice').value = '';
      document.getElementById('inputNote').value = '';
      document.getElementById('inputPaid').checked = false;

      if (paid) {
        confetti({ particleCount: 50, spread: 60, origin: { y: 0.8 } });
      }
    }

    function togglePaid(id) {
      const entry = entries.find(e => e.id === id);
      if (!entry) return;
      entry.paid = !entry.paid;
      
      saveToCloud();

      if (entry.paid) {
        confetti({ particleCount: 60, spread: 70, origin: { y: 0.7 } });
      }
    }

    function deleteEntry(id) {
      if (confirm("Vill du ta bort detta uttag?")) {
        entries = entries.filter(e => e.id !== id);
        saveToCloud();
      }
    }

    function updateStats() {
      const totalGramUsed = entries.reduce((sum, e) => sum + (e.gram || 0), 0);
      const totalKgUsed = totalGramUsed / 1000;
      const remainingKg = Math.max(0, 60 - totalKgUsed);
      const totalUnpaid = entries.filter(e => !e.paid).reduce((sum, e) => sum + (e.price || 0), 0);

      document.getElementById('statRemainingKg').innerText = remainingKg.toLocaleString('sv-SE', { minimumFractionDigits: 1, maximumFractionDigits: 1 });
      document.getElementById('statUsedKg').innerText = `Uttaget: ${totalKgUsed.toLocaleString('sv-SE', { minimumFractionDigits: 1, maximumFractionDigits: 1 })} kg`;
      document.getElementById('statTotalUnpaid').innerText = `${totalUnpaid} kr`;

      const progressPercent = Math.min(100, (totalKgUsed / 60) * 100);
      document.getElementById('progressBar').style.width = `${progressPercent}%`;
    }

    function renderEntries() {
      const filter = document.getElementById('filterSelect').value;
      const listContainer = document.getElementById('entriesList');

      let filtered = entries;
      if (filter === 'unpaid') filtered = entries.filter(e => !e.paid);
      if (filter === 'paid') filtered = entries.filter(e => e.paid);

      if (filtered.length === 0) {
        listContainer.innerHTML = `<div class="text-center py-8 text-slate-400 dark:text-slate-600 text-sm">Inga uttag registrerade än.</div>`;
        return;
      }

      listContainer.innerHTML = filtered.map(item => `
        <div class="flex items-center justify-between p-3.5 bg-slate-50 dark:bg-slate-800/60 border border-slate-200/70 dark:border-slate-800 rounded-xl">
          <div class="flex items-center gap-3">
            <button onclick="togglePaid('${item.id}')" title="Klicka för att ändra betalning" class="w-9 h-9 rounded-xl flex items-center justify-center transition ${item.paid ? 'bg-emerald-100 dark:bg-emerald-950/60 text-emerald-700 dark:text-emerald-400' : 'bg-amber-100 dark:bg-amber-950/60 text-amber-700 dark:text-amber-400 hover:bg-amber-200'}">
              <i class="fa-solid ${item.paid ? 'fa-check' : 'fa-clock'}"></i>
            </button>
            <div>
              <div class="flex items-center gap-2">
                <span class="font-bold text-slate-800 dark:text-slate-200 text-sm">${item.name}</span>
                <span class="text-xs bg-slate-200/60 dark:bg-slate-700 text-slate-600 dark:text-slate-300 px-2 py-0.5 rounded-md font-medium">${item.gram} g</span>
              </div>
              <div class="text-xs text-slate-400 dark:text-slate-500 mt-0.5 flex items-center gap-2">
                <span>${item.date}</span>
                ${item.note ? `<span>•</span><span class="italic text-slate-500 dark:text-slate-400">${item.note}</span>` : ''}
              </div>
            </div>
          </div>

          <div class="flex items-center gap-3">
            <div class="text-right">
              <div class="font-bold text-slate-900 dark:text-white text-sm">${item.price} kr</div>
              <span class="text-[10px] font-semibold uppercase px-1.5 py-0.5 rounded ${item.paid ? 'bg-emerald-50 dark:bg-emerald-950/40 text-emerald-600 dark:text-emerald-400' : 'bg-amber-50 dark:bg-amber-950/40 text-amber-600 dark:text-amber-400'}">
                ${item.paid ? 'Betald' : 'Obetald'}
              </span>
            </div>
            <button onclick="deleteEntry('${item.id}')" class="text-slate-300 dark:text-slate-600 hover:text-red-500 p-1 text-xs transition">
              <i class="fa-solid fa-trash"></i>
            </button>
          </div>
        </div>
      `).join('');
    }
  </script>
</body>
</html>
